[package]
name = "bonefish-sycl-emit"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "SYCL/DPC++ backend for the neutral unpopped kernel generator: lowers a KernelPlan to SYCL C++ source."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/bonefish"
publish = false

[dependencies]
# Pre-1.0 and moving: pinned exactly (unpopped's own advice).
unpopped = "=0.63.8"
unpopped-vocab = "=0.63.8"

[dev-dependencies]
unpopped = { version = "=0.63.8", features = ["fixtures"] }
