[package]
name = "bonefish"
version = "0.0.22"
edition = "2024"
description = "A safe Rust interface to Intel oneAPI / oneMKL on SYCL devices."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/bonefish"
readme = "README.md"
publish = false

[dependencies]
bonefish-sys = { version = "0.0.22", path = "bonefish-sys" }

[workspace]
members = [".", "bonefish-sys", "bonefish-sycl-emit"]
default-members = [".", "bonefish-sys", "bonefish-sycl-emit"]
